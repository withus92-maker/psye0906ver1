<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Android / PWA 기본 연결 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffe4e8">

    <!-- iOS (아이폰 Safari) 전용 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="우리의 공간">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <title>우리의 공간 ♡</title>

    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pastel-pink': '#ffe4e8',
                        'main-pink': '#ffb3c6',
                        'deep-pink': '#ff8fab',
                        'text-dark': '#5c4d50',
                        'text-light': '#8a7d80',
                        'pastel-blue': '#e0f2fe',
                        'pastel-purple': '#f3e8ff',
                        'main-purple': '#d8b4fe',
                        'deep-purple': '#a855f7',
                        'sticker-red': '#ff4d6d'
                    },
                    fontFamily: {
                        'dodum': ['"Gowun Dodum"', 'sans-serif'],
                        'jua': ['"Jua"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #ffe4e8;
            color: #5c4d50;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { display: none; }
        
        .cute-shadow { box-shadow: 0 4px 15px rgba(255, 143, 171, 0.2); }
        .purple-shadow { box-shadow: 0 4px 15px rgba(168, 85, 247, 0.15); }
        .login-shadow { box-shadow: 0 10px 25px rgba(255, 143, 171, 0.3); }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
            z-index: 50;
        }
        #sidebar.open { transform: translateX(0); }
        #sidebar-overlay {
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }
        #sidebar-overlay.open { opacity: 1; pointer-events: auto; }

        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        .photo-item { background: white; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 1 / 1; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .bucket-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        .bucket-card { background: white; border-radius: 16px; position: relative; aspect-ratio: 4 / 5; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; }
        .bucket-card:active { transform: scale(0.97); }

        .heart-loader { display: inline-block; position: relative; width: 80px; height: 80px; transform: rotate(45deg); transform-origin: 40px 40px; }
        .heart-loader div { top: 32px; left: 32px; position: absolute; width: 32px; height: 32px; background: #ff8fab; animation: heart-loader 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); }
        .heart-loader div:after, .heart-loader div:before { content: " "; position: absolute; display: block; width: 32px; height: 32px; background: #ff8fab; }
        .heart-loader div:before { left: -24px; border-radius: 50% 0 0 50%; }
        .heart-loader div:after { top: -24px; border-radius: 50% 50% 0 0; }
        @keyframes heart-loader { 0% { transform: scale(0.95); } 5% { transform: scale(1.1); } 39% { transform: scale(0.85); } 45% { transform: scale(1); } 60% { transform: scale(0.95); } 100% { transform: scale(0.9); } }

        .view-section { display: none; height: 100%; overflow-y: auto; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        input, textarea, select { outline: none; border: 2px solid #ffe4e8; border-radius: 12px; padding: 10px; width: 100%; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: #ffb3c6; }
        button { user-select: none; }
        
        .sticker-slot {
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; position: relative; cursor: pointer; transition: transform 0.2s;
        }
        .sticker-slot:active { transform: scale(0.9); }
        .sticker-num { position: absolute; font-size: 12px; color: white; font-weight: bold; top: 48%; left: 50%; transform: translate(-50%, -50%); text-shadow: 0px 1px 2px rgba(0,0,0,0.3); font-family: 'Jua', sans-serif;}
    </style>
</head>
<body>

    <!-- 전역 로더 -->
    <div id="app-loader" class="fixed inset-0 bg-pastel-pink z-[100] flex flex-col items-center justify-center">
        <div class="heart-loader"><div></div></div>
        <p class="mt-8 text-main-pink font-jua text-xl" id="loader-text">연결하는 중...</p>
    </div>

    <!-- 공통 알림 모달 -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 z-[110] hidden flex items-center justify-center px-4 transition-opacity">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm cute-shadow text-center relative overflow-hidden">
            <h3 id="modal-title" class="text-xl font-jua text-deep-pink mb-2">알림</h3>
            <p id="modal-message" class="text-text-dark mb-6 text-sm whitespace-pre-wrap leading-relaxed"></p>
            <div id="modal-buttons" class="flex gap-2 justify-center relative z-10">
                <button id="modal-btn-cancel" class="hidden px-4 py-2 rounded-xl bg-gray-200 text-gray-700 font-bold w-1/2">취소</button>
                <button id="modal-btn-confirm" class="px-4 py-2 rounded-xl bg-main-pink text-white font-bold w-full shadow-md">확인</button>
            </div>
            <div id="modal-confetti" class="absolute inset-0 pointer-events-none hidden bg-[url('https://cdn-icons-png.flaticon.com/512/8516/8516248.png')] bg-cover opacity-20"></div>
        </div>
    </div>

    <!-- 글쓰기/수정 커스텀 모달 -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 z-[105] hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-3xl p-5 w-full max-w-sm cute-shadow flex flex-col">
            <h3 class="text-lg font-jua text-deep-pink mb-3"><i class="fas fa-edit mr-2"></i>글 수정하기</h3>
            <input type="text" id="edit-input-title" placeholder="제목" class="mb-2 text-sm font-bold bg-gray-50 border-gray-200">
            <textarea id="edit-input-text" rows="5" placeholder="내용" class="mb-4 text-sm resize-none"></textarea>
            <div class="flex gap-2 justify-end">
                <button id="btn-edit-cancel" class="px-4 py-2 rounded-xl bg-gray-200 text-gray-700 font-bold text-sm">취소</button>
                <button id="btn-edit-save" class="px-4 py-2 rounded-xl bg-main-pink text-white font-bold text-sm">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 프로필 원본 보기 모달 -->
    <div id="profile-view-modal" class="fixed inset-0 bg-black/90 z-[120] hidden flex items-center justify-center p-4 transition-opacity">
        <button id="btn-close-profile-view" class="absolute top-6 right-6 text-white text-3xl p-2 z-10 drop-shadow-md"><i class="fas fa-times"></i></button>
        <img id="profile-view-img" src="" class="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-2xl">
    </div>

    <!-- 사진 상세 모달 (사진첩용) -->
    <div id="photo-modal" class="fixed inset-0 bg-black/90 z-[95] hidden flex-col transition-opacity h-full">
        <div class="flex justify-between items-center p-4">
            <div class="text-white font-jua text-lg">우리의 추억</div>
            <button id="btn-close-photo-modal" class="text-white text-2xl px-2 py-1"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex-1 overflow-hidden flex flex-col">
            <div class="w-full flex justify-center items-center bg-black min-h-[40vh] max-h-[55vh] overflow-hidden relative">
                <img id="photo-modal-img" src="" class="w-full h-full object-contain">
            </div>
            <div class="bg-white rounded-t-3xl mt-[-20px] relative p-5 flex-1 flex flex-col min-h-0">
                <h3 class="font-jua text-deep-pink text-lg mb-3 shrink-0">댓글</h3>
                <div id="photo-modal-comments" class="space-y-2 mb-4 overflow-y-auto flex-1"></div>
                <div class="flex gap-2 border-t pt-3 border-gray-100 shrink-0 pb-safe">
                    <input type="text" id="photo-comment-input" placeholder="댓글 남기기..." class="text-sm py-2 px-3 flex-1 border-gray-200">
                    <button id="btn-add-photo-comment" class="bg-main-pink text-white text-sm px-4 rounded-xl font-bold shadow-sm">등록</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 칭찬스티커 부여/비밀번호 확인 모달 -->
    <div id="sticker-action-modal" class="fixed inset-0 bg-black/60 z-[105] hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm cute-shadow text-center">
            <h3 class="text-xl font-jua text-blue-500 mb-2">칭찬스티커 붙이기</h3>
            <p class="text-xs text-gray-500 mb-4">여자친구만 스티커를 붙여줄 수 있어요!</p>
            
            <div id="sticker-step-auth">
                <input type="password" id="sticker-auth-pass" placeholder="본인 비밀번호 입력" class="mb-4 text-center border-blue-200 focus:border-blue-400">
                <div class="flex gap-2">
                    <button class="btn-sticker-cancel px-4 py-2 rounded-xl bg-gray-200 text-gray-700 font-bold w-1/2">취소</button>
                    <button id="btn-sticker-verify" class="px-4 py-2 rounded-xl bg-blue-500 text-white font-bold w-1/2 shadow-md">확인</button>
                </div>
            </div>

            <div id="sticker-step-reason" class="hidden">
                <input type="text" id="sticker-input-reason" placeholder="칭찬 이유를 짧게 적어주세요!" class="mb-4 text-center border-blue-200 focus:border-blue-400 text-sm">
                <div class="flex gap-2">
                    <button class="btn-sticker-cancel px-4 py-2 rounded-xl bg-gray-200 text-gray-700 font-bold w-1/2">취소</button>
                    <button id="btn-sticker-confirm" class="px-4 py-2 rounded-xl bg-sticker-red text-white font-bold w-1/2 shadow-md">스티커 확정</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 버킷리스트 생성 모달 -->
    <div id="bucket-add-modal" class="fixed inset-0 bg-black/60 z-[105] hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-3xl p-5 w-full max-w-sm purple-shadow flex flex-col">
            <h3 class="text-lg font-jua text-deep-purple mb-3">새로운 버킷리스트</h3>
            <div class="mb-3">
                <label class="block text-xs font-bold text-gray-500 mb-1 ml-1">아이콘 선택</label>
                <div class="flex flex-wrap gap-2 justify-center bg-gray-50 p-2 rounded-xl border border-purple-100" id="bucket-emoji-selector">
                    <!-- JS Rendering -->
                </div>
            </div>
            <input type="hidden" id="bucket-selected-emoji" value="❤️">
            <input type="text" id="bucket-input-title" placeholder="무엇을 함께 하고 싶나요?" class="mb-4 text-sm font-bold bg-gray-50 border-purple-200 focus:border-deep-purple">
            <div class="flex gap-2 justify-end">
                <button id="btn-bucket-add-cancel" class="px-4 py-2 rounded-xl bg-gray-200 text-gray-700 font-bold text-sm">취소</button>
                <button id="btn-bucket-add-save" class="px-4 py-2 rounded-xl bg-deep-purple text-white font-bold text-sm shadow-md">추가하기</button>
            </div>
        </div>
    </div>

    <!-- 버킷리스트 상세 모달 -->
    <div id="bucket-detail-modal" class="fixed inset-0 bg-black/80 z-[105] hidden flex-col h-full">
        <div class="flex justify-between items-center p-4 glass-panel z-10 sticky top-0">
            <div class="text-deep-purple font-jua text-lg" id="bucket-detail-header-title">버킷리스트</div>
            <button id="btn-close-bucket-detail" class="text-gray-500 text-2xl px-2 py-1"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto bg-pastel-purple pb-safe">
            <div class="bg-white m-4 rounded-3xl overflow-hidden purple-shadow">
                <!-- 달성 여부 표시 뱃지 -->
                <div id="bucket-detail-badge" class="absolute top-6 right-6 bg-deep-pink text-white font-jua text-sm px-3 py-1 rounded-full shadow-md hidden z-10 transform rotate-12">달성 완료!</div>
                
                <div class="p-6 text-center border-b border-purple-50">
                    <div class="text-5xl mb-3" id="bucket-detail-emoji">❤️</div>
                    <h2 class="text-xl font-jua text-text-dark break-all" id="bucket-detail-title">제목</h2>
                </div>
                
                <!-- 사진 영역 -->
                <div class="relative bg-gray-100 aspect-video flex items-center justify-center group overflow-hidden">
                    <img id="bucket-detail-photo" src="" class="hidden w-full h-full object-cover">
                    <div id="bucket-photo-placeholder" class="text-gray-400 text-center">
                        <i class="fas fa-camera text-3xl mb-2"></i>
                        <p class="text-xs font-bold">인증 사진 올리기</p>
                    </div>
                    <label class="absolute inset-0 cursor-pointer flex items-center justify-center bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fas fa-upload text-white text-3xl"></i>
                        <input type="file" id="bucket-upload-photo" accept="image/*" class="hidden">
                    </label>
                </div>

                <!-- 달성 버튼 및 삭제 버튼 -->
                <div class="p-4 flex gap-2 justify-center bg-purple-50 border-b border-purple-100">
                    <button id="btn-bucket-delete" class="font-jua text-sm px-4 py-2.5 rounded-full shadow-sm transition-all duration-300 bg-white text-gray-400 border-2 border-gray-200 hover:bg-gray-100 hover:text-red-400">
                        <i class="fas fa-trash-alt"></i> 삭제
                    </button>
                    <button id="btn-bucket-achieve" class="flex-1 font-jua text-lg px-6 py-2.5 rounded-full shadow-md transition-all duration-300 bg-white text-deep-purple border-2 border-deep-purple hover:bg-deep-purple hover:text-white">
                        <i class="fas fa-check-circle mr-2"></i>달성 체크하기
                    </button>
                </div>

                <!-- 후기(댓글) 영역 -->
                <div class="p-4">
                    <h3 class="font-jua text-main-purple text-base mb-3"><i class="fas fa-comment-dots mr-2"></i>우리의 후기</h3>
                    <div id="bucket-detail-comments" class="space-y-2 mb-4 max-h-[30vh] overflow-y-auto"></div>
                    <div class="flex gap-2 mt-2">
                        <input type="text" id="bucket-comment-input" placeholder="소감을 남겨주세요..." class="text-sm py-2 px-3 flex-1 border-purple-200">
                        <button id="btn-add-bucket-comment" class="bg-deep-purple text-white text-sm px-4 rounded-xl font-bold shadow-sm whitespace-nowrap">등록</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 로그인 뷰 -->
    <div id="login-view" class="fixed inset-0 bg-pastel-pink z-[80] hidden flex-col items-center justify-center p-5">
        <div class="bg-white rounded-3xl p-7 w-full max-w-sm login-shadow flex flex-col justify-center mb-8 relative z-10">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto bg-pastel-pink rounded-full flex items-center justify-center mb-3">
                    <i class="fas fa-heart text-3xl text-main-pink"></i>
                </div>
                <h1 class="text-3xl font-jua text-deep-pink mb-1">우리의 공간</h1>
                <p class="text-text-light text-sm">둘만의 비밀스러운 일기장</p>
            </div>

            <div class="flex bg-pastel-pink/30 rounded-xl mb-6 p-1 cute-shadow">
                <button id="tab-male" class="w-1/2 py-2 rounded-lg font-bold text-main-pink bg-pastel-pink transition-colors">남자친구</button>
                <button id="tab-female" class="w-1/2 py-2 rounded-lg font-bold text-text-light transition-colors">여자친구</button>
            </div>

            <div id="login-form-container">
                <p id="login-status-msg" class="text-sm text-main-pink mb-2 text-center h-5 transition-opacity duration-300"></p>
                <input type="text" id="login-id" class="hidden" readonly>
                <input type="password" id="login-password" placeholder="비밀번호 입력 (초기: 1234)" class="mb-6 text-center focus:border-main-pink">
                <button id="btn-login" class="w-full bg-main-pink hover:bg-deep-pink text-white font-bold py-3.5 rounded-xl transition-colors shadow-md text-lg">
                    입장하기
                </button>
            </div>
        </div>
        <i class="fas fa-heart absolute top-10 left-10 text-main-pink/20 text-5xl transform -rotate-12"></i>
        <i class="fas fa-heart absolute bottom-20 right-10 text-main-pink/20 text-6xl transform rotate-12"></i>
    </div>

    <!-- 메인 앱 영역 -->
    <div id="main-app" class="hidden h-full flex flex-col relative bg-[#fffafb]">
        <!-- 고정 헤더 -->
        <header class="fixed top-0 left-0 right-0 h-14 glass-panel z-30 flex items-center justify-between px-4">
            <button id="btn-menu" class="text-deep-pink text-2xl p-2 active:scale-90 transition-transform"><i class="fas fa-bars"></i></button>
            <h1 id="header-title" class="font-jua text-xl text-deep-pink">우리의 홈</h1>
            <div class="w-8"></div>
        </header>

        <!-- 사이드바 오버레이 -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/40"></div>
        
        <!-- 좌측 사이드바 메뉴 -->
        <nav id="sidebar" class="fixed top-0 left-0 bottom-0 w-64 bg-white shadow-2xl flex flex-col">
            <div class="bg-pastel-pink p-6 text-center rounded-br-3xl">
                <div class="w-20 h-20 mx-auto bg-white rounded-full mb-3 flex items-center justify-center overflow-hidden border-4 border-white cute-shadow cursor-pointer hover:opacity-90" onclick="if(currentUserData.profilePic) viewProfilePic(currentUserData.profilePic)">
                    <img id="menu-profile-pic" src="https://placehold.co/150x150/ffb3c6/ffffff?text=♡" class="w-full h-full object-cover">
                </div>
                <h2 id="menu-nickname" class="font-jua text-lg text-deep-pink">닉네임</h2>
            </div>
            
            <div class="flex-1 overflow-y-auto py-4">
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-pink/50 transition-colors flex items-center" data-target="home">
                    <i class="fas fa-home w-6 text-main-pink text-center mr-2"></i> 홈 화면
                </button>
                
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-pink/50 transition-colors flex items-center relative" data-target="text-board">
                    <i class="fas fa-pen-nib w-6 text-main-pink text-center mr-2"></i> 이야기 공간
                    <!-- 알림 하트 뱃지 -->
                    <div id="badge-text-board" class="hidden absolute right-4 bg-deep-pink text-white text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center shadow-sm">
                        <i class="fas fa-heart text-[8px] mr-1"></i><span id="badge-text-board-count" class="ml-1">0</span>
                    </div>
                </button>
                
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-pink/50 transition-colors flex items-center" data-target="photo-board">
                    <i class="fas fa-image w-6 text-main-pink text-center mr-2"></i> 추억 앨범
                </button>

                <!-- 신규 메뉴: 칭찬스티커, 버킷리스트 -->
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-blue/50 transition-colors flex items-center" data-target="sticker">
                    <i class="fas fa-award w-6 text-blue-400 text-center mr-2"></i> 칭찬스티커
                </button>
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-purple/50 transition-colors flex items-center" data-target="bucket">
                    <i class="fas fa-list-check w-6 text-deep-purple text-center mr-2"></i> 버킷리스트
                </button>
                
                <div class="my-2 border-t border-gray-100"></div>
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-pink/50 transition-colors flex items-center" data-target="settings">
                    <i class="fas fa-cog w-6 text-main-pink text-center mr-2"></i> 설정
                </button>
            </div>
            
            <div class="p-4 border-t border-gray-100 shrink-0 pb-safe">
                <button id="btn-logout" class="w-full py-2 text-sm text-text-light hover:text-deep-pink transition-colors">로그아웃</button>
            </div>
        </nav>

        <main class="flex-1 mt-14 relative h-[calc(100%-3.5rem)]">
            
            <!-- 홈 뷰 (대문 사진 + 디데이) -->
            <section id="view-home" class="view-section active p-0 relative h-full">

        // ★ 유저의 Firebase Realtime Database 설정값
        const firebaseConfig = {
            apiKey: "AIzaSyAZ6SfOKBCftecei_iFGD3-Moen-6AEgBs",
            authDomain: "psye1-65fb3.firebaseapp.com",
            databaseURL: "https://psye1-65fb3-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "psye1-65fb3",
            storageBucket: "psye1-65fb3.firebasestorage.app",
            messagingSenderId: "198807152212",

        const currentAppId = 'couple-app-psye1';

        // --- 전역 상태 변수 ---

        const EMOJIS = ['❤️', '🍔', '✈️', '🎮', '🏕️', '🎬', '🛍️', '🎤', '☕', '🎡', '🎂', '🥂', '📸', '🎵', '🏖️', '🎢', '🎨', '🚙', '💍', '🏡'];

            tabs: { male: document.getElementById('tab-male'), female: document.getElementById('tab-female') }

        let selectedLoginRole = 'male'; 

        // --- 유틸리티 ---
        const Utils = {
            showModal: (title, message, isConfirm = false, onConfirm = null, showConfetti = false) => {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                const modal = document.getElementById('custom-modal');
                const btnCancel = document.getElementById('modal-btn-cancel');
                const btnConfirm = document.getElementById('modal-btn-confirm');
                const confetti = document.getElementById('modal-confetti');
                
                modal.classList.remove('hidden');
                if(showConfetti) confetti.classList.remove('hidden');
                else confetti.classList.add('hidden');
                
                if (isConfirm) {
                    btnCancel.classList.remove('hidden');
                    btnConfirm.classList.replace('w-full', 'w-1/2');
                } else {
                    btnCancel.classList.add('hidden');
                    btnConfirm.classList.replace('w-1/2', 'w-full');
                }

                const close = () => { modal.classList.add('hidden'); confetti.classList.add('hidden'); };
                
                // 이벤트 리스너 중복 방지
                btnConfirm.onclick = () => { close(); if(onConfirm) onConfirm(); };
                btnCancel.onclick = () => close();
            },
            
            showView: (targetId, title) => {
                UI.views.forEach(v => v.classList.remove('active'));
                document.getElementById('view-' + targetId).classList.add('active');
                UI.headerTitle.innerText = title;
                UI.sidebar.classList.remove('open');
                UI.sidebarOverlay.classList.remove('open');

                if(targetId === 'text-board') {
                    lastViewedTextBoard = Date.now();
                    localStorage.setItem(`couple_app_last_viewed_${currentRole}`, lastViewedTextBoard.toString());
                    updateTextBoardBadge();
                }
            },

            formatDate: (timestamp) => {
                if(!timestamp) return '';
                const d = new Date(timestamp);
                const ampm = d.getHours() >= 12 ? '오후' : '오전';
                const h = d.getHours() % 12 || 12;
                const m = String(d.getMinutes()).padStart(2,'0');
                return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${ampm} ${h}:${m}`;
            },

            resizeImage: (file, maxWidth, quality, callback) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        callback(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            calculateDday: (startDateStr) => {
                if(!startDateStr) return "설정 필요";
                const start = new Date(startDateStr); start.setHours(0,0,0,0);
                const now = new Date(); now.setHours(0,0,0,0);
                const diff = now - start;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24)) + 1;
                return `D+${days}`;
            },

            escapeHtml: (text) => {
                if(!text) return '';
                return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }
        };

        // --- 로그인 및 초기 설정 ---
        signInAnonymously(auth).then(() => {
            checkCoupleAppSetup();
        }).catch(err => {
            UI.loader.classList.add('hidden');
            Utils.showModal("오류", "데이터베이스 연결에 실패했습니다.");
        });

        async function checkCoupleAppSetup() {
            try {
                const savedRole = sessionStorage.getItem(`couple_role_${currentAppId}`);
                
                onValue(settingsRef, (snapshot) => {
                    if (snapshot.exists()) {
                        coupleData = snapshot.val();
                        if (currentRole) { renderHome(); renderSettingsInput(); }
                    }
                });

                onValue(usersRef, (snapshot) => {
                    UI.loader.classList.add('hidden');
                    if (snapshot.exists()) {
                        allUsersData = snapshot.val();
                        if (savedRole && allUsersData[savedRole]) {
                            currentRole = savedRole;
                            currentUserData = allUsersData[savedRole];
                            startApp();
                        } else {
                            UI.loginView.classList.remove('hidden');
                            UI.mainApp.classList.add('hidden');
                        }
                    } else {
                        // 최초 생성
                        set(usersRef, {
                            male: { pass: '1234', nickname: '남자친구', birthdate: '', profilePic: '' },
                            female: { pass: '1234', nickname: '여자친구', birthdate: '', profilePic: '' }
                        }).then(() => {
                            set(settingsRef, { dday: '', bgImage: '' });
                            Utils.showModal("환영합니다", "초기 데이터가 생성되었습니다.\n기본 비밀번호는 '1234' 입니다.");
                        });
                    }
                });
            } catch (e) {
                console.error(e);
            }
        }

        UI.tabs.male.onclick = () => {
            selectedLoginRole = 'male';
            UI.tabs.male.classList.replace('text-text-light', 'text-main-pink'); UI.tabs.male.classList.add('bg-pastel-pink');
            UI.tabs.female.classList.replace('text-main-pink', 'text-text-light'); UI.tabs.female.classList.remove('bg-pastel-pink');
            document.getElementById('login-id').value = 'male';
        };
        UI.tabs.female.onclick = () => {
            selectedLoginRole = 'female';
            UI.tabs.female.classList.replace('text-text-light', 'text-main-pink'); UI.tabs.female.classList.add('bg-pastel-pink');
            UI.tabs.male.classList.replace('text-main-pink', 'text-text-light'); UI.tabs.male.classList.remove('bg-pastel-pink');
            document.getElementById('login-id').value = 'female';
        };
        document.getElementById('login-id').value = 'male';

        document.getElementById('btn-login').onclick = () => {
            const pass = document.getElementById('login-password').value;
            const statusMsg = document.getElementById('login-status-msg');
            
            if (allUsersData[selectedLoginRole].pass === pass) {
                currentRole = selectedLoginRole;
                currentUserData = allUsersData[selectedLoginRole];
                sessionStorage.setItem(`couple_role_${currentAppId}`, currentRole);
                
                document.activeElement.blur(); 
                document.getElementById('login-password').blur();
                document.getElementById('login-password').value = '';
                
                UI.loginView.classList.add('hidden');
                startApp();
            } else {
                statusMsg.innerText = "비밀번호가 일치하지 않습니다.";
                setTimeout(() => { if (statusMsg.innerText === "비밀번호가 일치하지 않습니다.") statusMsg.innerText = ""; }, 2000);
            }
        };

        document.getElementById('btn-logout').onclick = () => {
            Utils.showModal("로그아웃", "로그아웃 하시겠습니까?", true, () => {
                sessionStorage.removeItem(`couple_role_${currentAppId}`);

                UI.sidebar.classList.remove('open'); UI.sidebarOverlay.classList.remove('open');

        function startApp() {

            Utils.showView('home', '우리의 홈');

            renderHome();
            renderSettingsInput();

            unsubscribes.push(
                onValue(postsRef, (snapshot) => {
                    let posts = [];
                    snapshot.forEach(child => { posts.push({ id: child.key, ...child.val() }); });
                    posts.sort((a, b) => b.timestamp - a.timestamp);
                    currentPostsList = posts;
                    renderTextBoard(posts);
                    updateTextBoardBadge();
                })
            );

            // 사진첩 구독
            unsubscribes.push(
                onValue(photosRef, (snapshot) => {
                    let photos = [];
                    snapshot.forEach(child => { photos.push({ id: child.key, ...child.val() }); });
                    photos.sort((a, b) => b.timestamp - a.timestamp);
                    currentPhotosList = photos;
                    renderPhotoBoard(photos);
                    
                    if (currentPhotoModalId && !document.getElementById('photo-modal').classList.contains('hidden')) {
                        const updatedPhoto = currentPhotosList.find(p => p.id === currentPhotoModalId);
                        if (updatedPhoto) renderPhotoComments(updatedPhoto);
                        else document.getElementById('photo-modal').classList.add('hidden');

            // 칭찬스티커 구독

                    currentStickers = snapshot.val() || {};
                    renderStickers();
                })
            );

            // 버킷리스트 구독
            unsubscribes.push(
                onValue(bucketsRef, (snapshot) => {
                    let buckets = [];
                    snapshot.forEach(child => { buckets.push({ id: child.key, ...child.val() }); });
                    buckets.sort((a, b) => b.timestamp - a.timestamp);

        // --- 칭찬스티커 로직 ---
        function renderStickers() {
            const container = document.getElementById('sticker-grape-container');
            container.innerHTML = '';
            
            let filledCount = 0;
            for(let i=1; i<=20; i++) { if(currentStickers[i]) filledCount++; }
            document.getElementById('sticker-count-display').innerText = filledCount;

            // 포도송이 레이아웃: [4, 4, 4, 3, 3, 2] = 20개
            const layout = [4, 4, 4, 3, 3, 2];
            let stickerIndex = 1;

            layout.forEach(rowSize => {
                let rowHtml = `<div class="flex gap-2 justify-center">`;
                for(let i=0; i<rowSize; i++) {
                    const sNum = stickerIndex++;
                    const isRed = (sNum % 5 === 0);
                    const filled = currentStickers[sNum];
                    
                    if(filled) {
                        const heartColor = isRed ? 'text-sticker-red' : 'text-deep-pink';
                        rowHtml += `
                            <div class="sticker-slot hover:scale-110 drop-shadow-md" onclick="showStickerReason(${sNum})">
                                <i class="fas fa-heart ${heartColor} text-[45px]"></i>
                                <span class="sticker-num">${sNum}</span>
                            </div>
                        `;
                    } else {
                        // 빈 슬롯 (클릭 시 붙이기)
                        rowHtml += `
                            <div class="sticker-slot hover:scale-110" onclick="attemptAddSticker(${sNum})">
                                <i class="far fa-heart text-white/70 text-[40px] drop-shadow-sm"></i>
                                <span class="sticker-num text-white/50">${sNum}</span>
                            </div>
                        `;
                    }
                }
                rowHtml += `</div>`;
                container.insertAdjacentHTML('beforeend', rowHtml);
            });
        }

            if(!text) return;
            try {
                const postRef = ref(db, `${basePath}/posts/${postId}`);
                const snap = await get(postRef);
                if(snap.exists()) {
                    let comments = snap.val().comments || [];
                    comments.push({ text: text, authorRole: currentRole, timestamp: Date.now() });
                    await update(postRef, { comments: comments });
                    input.value = ''; document.activeElement.blur();
                }
            } catch(e) { Utils.showModal("오류", "댓글 작성 실패"); }
        };

        window.deleteComment = async (postId, commentIdx) => {
            Utils.showModal("삭제", "댓글을 지울까요?", true, async () => {
                const postRef = ref(db, `${basePath}/posts/${postId}`);
                const snap = await get(postRef);
                if(snap.exists()) {
                    let comments = snap.val().comments || [];
                    comments.splice(commentIdx, 1);
                    await update(postRef, { comments: comments });
                }
            });
        };

        // --- 사진 게시판 로직 ---
        document.getElementById('input-upload-photo').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            Utils.showModal("업로드 중", "사진을 최적화하여 올리고 있습니다...");
            Utils.resizeImage(file, 1080, 0.7, async (base64) => {
                try {
                    await set(push(photosRef), { image: base64, authorRole: currentRole, timestamp: Date.now(), comments: [] });
                    document.getElementById('custom-modal').classList.add('hidden');
                } catch(err) { Utils.showModal("오류", "사진 업로드 실패"); }
            });
        };

        function renderPhotoBoard(photos) {
            const gridEl = document.getElementById('photo-grid');
            gridEl.innerHTML = '';
            
            if(photos.length === 0) {
                gridEl.innerHTML = '<p class="text-center text-text-light py-10 text-sm w-full col-span-2">첫 번째 사진을 올려보세요 ♡</p>';
                return;
            }

            photos.forEach(photo => {
                const isMine = photo.authorRole === currentRole;
                const cCount = photo.comments ? photo.comments.length : 0;
                const html = `
                    <div class="photo-item cute-shadow group cursor-pointer active:scale-95 transition-transform" onclick="openPhotoModal('${photo.id}')">
                        <img src="${photo.image}" loading="lazy">
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-2 flex justify-between items-end pointer-events-none">
                            <span class="text-white text-[10px] drop-shadow-md font-bold"><i class="fas fa-comment mr-1"></i> ${cCount}</span>
                        </div>
                        ${isMine ? `<button class="absolute top-2 right-2 text-white text-[10px] bg-black/50 px-2 py-1 rounded-full shadow pointer-events-auto" onclick="event.stopPropagation(); deletePhoto('${photo.id}')"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                `;
                gridEl.insertAdjacentHTML('beforeend', html);
            });
        }

        window.deletePhoto = (photoId) => { Utils.showModal("삭제", "이 사진을 지울까요?", true, async () => { await remove(ref(db, `${basePath}/photos/${photoId}`)); }); };

        window.openPhotoModal = (photoId) => {
            const photo = currentPhotosList.find(p => p.id === photoId);
            if(!photo) return;
            currentPhotoModalId = photoId;
            document.getElementById('photo-modal-img').src = photo.image;
            document.getElementById('photo-modal').classList.remove('hidden');
            document.getElementById('photo-comment-input').value = '';
            renderPhotoComments(photo);
        };
        
        document.getElementById('btn-close-photo-modal').onclick = () => { document.getElementById('photo-modal').classList.add('hidden'); currentPhotoModalId = null; };

        window.renderPhotoComments = (photo) => {
            const commentsContainer = document.getElementById('photo-modal-comments');
            commentsContainer.innerHTML = '';
            
            if(!photo.comments || photo.comments.length === 0) {
                commentsContainer.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">아직 댓글이 없습니다.</p>'; return;
            }

            photo.comments.forEach((c, idx) => {
                const cIsMine = c.authorRole === currentRole;
                const cName = allUsersData[c.authorRole]?.nickname || '알 수 없음';
                const cDate = c.timestamp ? Utils.formatDate(c.timestamp) : '';
                const html = `
                    <div class="flex items-start gap-2 bg-pastel-pink/30 p-2.5 rounded-xl mb-2">
                        <div class="flex flex-col min-w-fit mt-0.5">
                            <span class="text-xs font-bold text-main-pink">${cName}</span>
                            <span class="text-[9px] text-gray-400 leading-tight mt-0.5">${cDate}</span>
                        </div>
                        <span class="text-xs text-text-dark flex-1 break-all mt-0.5">${Utils.escapeHtml(c.text)}</span>
                        ${cIsMine ? `<button class="text-xs text-gray-400 hover:text-red-400 mt-0.5" onclick="deletePhotoComment('${photo.id}', ${idx})"><i class="fas fa-times"></i></button>` : ''}
                    </div>
                `;
                commentsContainer.insertAdjacentHTML('beforeend', html);
            });
            setTimeout(() => { commentsContainer.scrollTop = commentsContainer.scrollHeight; }, 50);
        };

        document.getElementById('btn-add-photo-comment').onclick = async () => {
            if(!currentPhotoModalId) return;
            const input = document.getElementById('photo-comment-input');
            const text = input.value.trim();
            if(!text) return;
            try {
                const photoRef = ref(db, `${basePath}/photos/${currentPhotoModalId}`);
                const snap = await get(photoRef);
                if(snap.exists()) {
                    let comments = snap.val().comments || [];
                    comments.push({ text: text, authorRole: currentRole, timestamp: Date.now() });
                    await update(photoRef, { comments: comments });
                    input.value = ''; document.activeElement.blur();
                }
            } catch(e) { Utils.showModal("오류", "댓글 작성 실패"); }
        };

        window.deletePhotoComment = async (photoId, commentIdx) => {
            Utils.showModal("삭제", "댓글을 삭제할까요?", true, async () => {
                const photoRef = ref(db, `${basePath}/photos/${photoId}`);
                const snap = await get(photoRef);
                if(snap.exists()) {
                    let comments = snap.val().comments || [];
                    comments.splice(commentIdx, 1);
                    await update(photoRef, { comments: comments });
                }
            });
        };

        // --- 설정 로직 ---
        function renderSettingsInput() {
            document.getElementById('setting-nickname').value = currentUserData.nickname || '';
            document.getElementById('setting-birthdate').value = currentUserData.birthdate || '';
            if (currentUserData.profilePic) document.getElementById('setting-profile-pic').src = currentUserData.profilePic;
            else document.getElementById('setting-profile-pic').src = "https://placehold.co/150x150/ffb3c6/ffffff?text=♡";
            if (coupleData.dday) document.getElementById('setting-dday').value = coupleData.dday;
        }

        document.getElementById('btn-save-my-info').onclick = async () => {
            const newNick = document.getElementById('setting-nickname').value.trim();
            const newBirth = document.getElementById('setting-birthdate').value;
            const newPass = document.getElementById('setting-password').value.trim();
            
            let updateData = {};
            if(newNick) updateData[`${currentRole}/nickname`] = newNick;
            updateData[`${currentRole}/birthdate`] = newBirth;
            if(newPass) updateData[`${currentRole}/pass`] = newPass;

            try {
                await update(usersRef, updateData);
                currentUserData.nickname = newNick || currentUserData.nickname;
                currentUserData.birthdate = newBirth;
                if(newPass) currentUserData.pass = newPass;
                updateSidebarProfile();
                
                document.activeElement.blur();
                document.getElementById('setting-password').value = '';
                Utils.showModal("성공", "내 정보가 수정되었습니다.");
            } catch(e) { Utils.showModal("오류", "저장에 실패했습니다."); }
        };

        document.getElementById('btn-save-couple-info').onclick = async () => {
            const newDday = document.getElementById('setting-dday').value;
            try {
                await update(settingsRef, { dday: newDday });
                Utils.showModal("성공", "커플 정보가 저장되었습니다.");
                document.activeElement.blur();
            } catch(e) { Utils.showModal("오류", "저장에 실패했습니다."); }
        };
    </script>
</body>
</html>
