<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리의 공간 ♡</title>
    
    <!-- Android / PWA 기본 연결 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffe4e8">

    <!-- iOS (아이폰 Safari) 전용 설정: 상단바 숨김 및 아이콘 지정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="우리의 공간">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pastel-pink': '#ffe4e8',
                        'main-pink': '#ffb3c6',
                        'deep-pink': '#ff8fab',
                        'text-dark': '#5c4d50',
                        'text-light': '#8a7d80'
                    },
                    fontFamily: {
                        'dodum': ['"Gowun Dodum"', 'sans-serif'],
                        'jua': ['"Jua"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* 모바일 브라우저 하단 바에 가려지지 않도록 동적 뷰포트(dvh) 적용 */
        html, body {
            height: 100%;
            height: 100dvh;
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #ffe4e8;
            color: #5c4d50;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 전역 스크롤 방지, 내부 영역만 스크롤 */
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { display: none; }
        
        .cute-shadow { box-shadow: 0 4px 15px rgba(255, 143, 171, 0.2); }
        .login-shadow { box-shadow: 0 10px 25px rgba(255, 143, 171, 0.3); }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
            z-index: 50;
        }
        #sidebar.open { transform: translateX(0); }
        #sidebar-overlay {
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }
        #sidebar-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }
        .photo-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1 / 1;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .heart-loader {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
            transform: rotate(45deg);
            transform-origin: 40px 40px;
        }
        .heart-loader div {
            top: 32px;
            left: 32px;
            position: absolute;
            width: 32px;
            height: 32px;
            background: #ff8fab;
            animation: heart-loader 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }
        .heart-loader div:after, .heart-loader div:before {
            content: " ";
            position: absolute;
            display: block;
            width: 32px;
            height: 32px;
            background: #ff8fab;
        }
        .heart-loader div:before { left: -24px; border-radius: 50% 0 0 50%; }
        .heart-loader div:after { top: -24px; border-radius: 50% 50% 0 0; }
        @keyframes heart-loader {
            0% { transform: scale(0.95); }
            5% { transform: scale(1.1); }
            39% { transform: scale(0.85); }
            45% { transform: scale(1); }
            60% { transform: scale(0.95); }
            100% { transform: scale(0.9); }
        }

        .view-section { display: none; padding-bottom: 80px; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        input, textarea, select {
            outline: none;
            border: 2px solid #ffe4e8;
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #ffb3c6; }
        button { user-select: none; }
    </style>
</head>
<body>

    <!-- 전역 로더 -->
    <div id="app-loader" class="fixed inset-0 bg-pastel-pink z-[100] flex flex-col items-center justify-center">
        <div class="heart-loader"><div></div></div>
        <p class="mt-8 text-main-pink font-jua text-xl" id="loader-text">서버와 연결하는 중...</p>
    </div>

    <!-- 알림 모달 -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 z-[110] hidden flex items-center justify-center px-4 transition-opacity">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm cute-shadow text-center">
            <h3 id="modal-title" class="text-xl font-jua text-deep-pink mb-2">알림</h3>
            <p id="modal-message" class="text-text-dark mb-6 text-sm"></p>
            <div id="modal-buttons" class="flex gap-2 justify-center">
                <button id="modal-btn-cancel" class="hidden px-4 py-2 rounded-xl bg-gray-200 text-gray-700 font-bold w-1/2">취소</button>
                <button id="modal-btn-confirm" class="px-4 py-2 rounded-xl bg-main-pink text-white font-bold w-full">확인</button>
            </div>
        </div>
    </div>

    <!-- 글쓰기/수정 커스텀 모달 -->
    <div id="edit-modal" class="fixed inset-0 bg-black/60 z-[105] hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-3xl p-5 w-full max-w-sm cute-shadow flex flex-col">
            <h3 class="text-lg font-jua text-deep-pink mb-3"><i class="fas fa-edit mr-2"></i>글 수정하기</h3>
            <input type="text" id="edit-input-title" placeholder="제목" class="mb-2 text-sm font-bold bg-gray-50 border-gray-200">
            <textarea id="edit-input-text" rows="4" placeholder="내용" class="mb-4 text-sm resize-none"></textarea>
            <div class="flex gap-2 justify-end">
                <button id="btn-edit-cancel" class="px-4 py-2 rounded-xl bg-gray-200 text-gray-700 font-bold text-sm">취소</button>
                <button id="btn-edit-save" class="px-4 py-2 rounded-xl bg-main-pink text-white font-bold text-sm">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 사진 상세 및 댓글 모달 -->
    <div id="photo-modal" class="fixed inset-0 bg-black/90 z-[95] hidden flex-col transition-opacity h-full">
        <div class="flex justify-between items-center p-4">
            <div class="text-white font-jua text-lg">우리의 추억</div>
            <button id="btn-close-photo-modal" class="text-white text-2xl px-2 py-1"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex-1 overflow-hidden flex flex-col">
            <div class="w-full flex justify-center items-center bg-black min-h-[40vh] max-h-[60vh] overflow-hidden">
                <img id="photo-modal-img" src="" class="w-full h-full object-contain">
            </div>
            <div class="bg-white rounded-t-3xl mt-[-20px] relative p-5 flex-1 flex flex-col min-h-0">
                <h3 class="font-jua text-deep-pink text-lg mb-3 shrink-0">댓글</h3>
                <div id="photo-modal-comments" class="space-y-2 mb-4 overflow-y-auto flex-1">
                    <!-- JS로 렌더링 -->
                </div>
                <div class="flex gap-2 border-t pt-3 border-gray-100 shrink-0 pb-safe">
                    <input type="text" id="photo-comment-input" placeholder="따뜻한 댓글 남기기..." class="text-sm py-2 px-3 flex-1 border-gray-200">
                    <button id="btn-add-photo-comment" class="bg-main-pink text-white text-sm px-4 rounded-xl whitespace-nowrap font-bold shadow-sm">등록</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 심플하게 개선된 로그인 뷰 (모바일 주소창 대응) -->
    <div id="login-view" class="fixed inset-0 bg-pastel-pink z-[80] hidden flex-col items-center justify-center p-5">
        <!-- 하단 마진(mb-16)을 주어 모바일 주소창/툴바에 폼이 가려지지 않게 중간 위로 배치 -->
        <div class="bg-white rounded-3xl p-7 w-full max-w-sm login-shadow flex flex-col justify-center mb-16 relative z-10">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto bg-pastel-pink rounded-full flex items-center justify-center mb-3">
                    <i class="fas fa-heart text-3xl text-main-pink"></i>
                </div>
                <h1 class="text-3xl font-jua text-deep-pink mb-1">우리의 공간</h1>
                <p class="text-text-light text-sm">둘만의 비밀스러운 일기장</p>
            </div>

            <div class="flex bg-pastel-pink/30 rounded-xl mb-6 p-1 cute-shadow">
                <button id="tab-male" class="w-1/2 py-2 rounded-lg font-bold text-main-pink bg-pastel-pink transition-colors">남자친구</button>
                <button id="tab-female" class="w-1/2 py-2 rounded-lg font-bold text-text-light transition-colors">여자친구</button>
            </div>

            <div id="login-form-container">
                <p id="login-status-msg" class="text-sm text-main-pink mb-2 text-center h-5"></p>
                <input type="text" id="login-id" placeholder="아이디 입력 (고정)" class="mb-3 bg-gray-50 text-text-light outline-none text-center font-bold" readonly>
                <input type="password" id="login-password" placeholder="비밀번호 입력 (초기: 1234)" class="mb-6 text-center">
                <button id="btn-login" class="w-full bg-main-pink hover:bg-deep-pink text-white font-bold py-3.5 rounded-xl transition-colors shadow-md text-lg">
                    입장하기
                </button>
            </div>
        </div>
        
        <!-- 장식용 배경 하트 -->
        <i class="fas fa-heart absolute top-10 left-10 text-main-pink/20 text-5xl transform -rotate-12"></i>
        <i class="fas fa-heart absolute bottom-20 right-10 text-main-pink/20 text-6xl transform rotate-12"></i>
    </div>

    <!-- 메인 앱 영역 -->
    <div id="main-app" class="hidden h-full flex flex-col relative">
        <header class="fixed top-0 left-0 right-0 h-14 glass-panel z-30 flex items-center justify-between px-4">
            <button id="btn-menu" class="text-deep-pink text-2xl p-2"><i class="fas fa-bars"></i></button>
            <h1 id="header-title" class="font-jua text-xl text-deep-pink">우리의 홈</h1>
            <div class="w-8"></div>
        </header>

        <div id="sidebar-overlay" class="fixed inset-0 bg-black/40"></div>
        <nav id="sidebar" class="fixed top-0 left-0 bottom-0 w-64 bg-white shadow-2xl flex flex-col">
            <div class="bg-pastel-pink p-6 text-center rounded-br-3xl">
                <div class="w-20 h-20 mx-auto bg-white rounded-full mb-3 flex items-center justify-center overflow-hidden border-4 border-white cute-shadow">
                    <img id="menu-profile-pic" src="https://placehold.co/150x150/ffb3c6/ffffff?text=♡" class="w-full h-full object-cover">
                </div>
                <h2 id="menu-nickname" class="font-jua text-lg text-deep-pink">닉네임</h2>
                <p id="menu-role" class="text-xs text-text-light mt-1"></p>
            </div>
            <div class="flex-1 overflow-y-auto py-4">
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-pink/50 transition-colors" data-target="home">
                    <i class="fas fa-home w-6 text-main-pink text-center mr-2"></i> 홈 화면
                </button>
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-pink/50 transition-colors" data-target="text-board">
                    <i class="fas fa-pen-nib w-6 text-main-pink text-center mr-2"></i> 이야기 공간
                </button>
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-pink/50 transition-colors" data-target="photo-board">
                    <i class="fas fa-image w-6 text-main-pink text-center mr-2"></i> 추억 앨범
                </button>
                <div class="my-2 border-t border-gray-100"></div>
                <button class="nav-btn w-full text-left px-6 py-3 text-text-dark hover:bg-pastel-pink/50 transition-colors" data-target="settings">
                    <i class="fas fa-cog w-6 text-main-pink text-center mr-2"></i> 설정
                </button>
            </div>
            <div class="p-4 border-t border-gray-100 shrink-0 pb-safe">
                <button id="btn-logout" class="w-full py-2 text-sm text-text-light hover:text-deep-pink transition-colors">로그아웃</button>
            </div>
        </nav>

        <main class="flex-1 mt-14 relative h-[calc(100%-3.5rem)] overflow-y-auto bg-[#fffafb]">
            
            <!-- 홈 뷰 (대문 사진 역할) -->
            <section id="view-home" class="view-section active h-full relative p-0">
                <div id="home-bg-container" class="absolute inset-0 bg-cover bg-center z-0 transition-all duration-500" style="background-image: url('https://placehold.co/1080x1920/ffe4e8/ffb3c6?text=Upload+Cover+Photo');">
                    <!-- 어두운 오버레이 추가로 텍스트 가독성 확보 -->
                    <div class="absolute inset-0 bg-black/20"></div>
                </div>
                
                <!-- 중앙 정렬(justify-center)을 상단 정렬(justify-start)로 변경하고 상단 여백(pt-24) 추가 -->
                <div class="relative z-10 flex flex-col items-center justify-start h-full pt-24 pb-20 px-4">
                    <!-- 투명도 60% (bg-white/40 적용) 및 하단 마진(mb-10) 제거 -->
                    <div class="bg-white/40 backdrop-blur-md border border-white/50 p-8 rounded-3xl text-center cute-shadow w-full max-w-sm">
                        <h2 class="text-lg text-white font-bold mb-2 drop-shadow-md">우리가 함께한 지</h2>
                        <div class="font-jua text-5xl text-deep-pink mb-4 drop-shadow-md">
                            <span id="dday-count">D+0</span>
                        </div>
                        <p class="text-sm text-white font-bold drop-shadow-md" id="dday-date">YYYY.MM.DD 시작</p>
                    </div>
                    
                    <!-- 카메라 버튼 위치 상향 조정 (하단 메뉴바 회피) -->
                    <div class="absolute bottom-12 right-6">
                        <label class="bg-white text-main-pink w-14 h-14 rounded-full flex items-center justify-center cute-shadow cursor-pointer hover:bg-gray-50 transition-colors shadow-lg">
                            <i class="fas fa-camera text-2xl"></i>
                            <input type="file" id="input-home-bg" accept="image/*" class="hidden">
                        </label>
                    </div>
                </div>
            </section>

            <!-- 설정 뷰 -->
            <section id="view-settings" class="view-section p-4">
                <h2 class="font-jua text-2xl text-deep-pink mb-4 ml-2"><i class="fas fa-cog mr-2"></i>우리의 정보 설정</h2>
                
                <div class="bg-white rounded-3xl p-5 cute-shadow mb-6">
                    <h3 class="font-bold text-main-pink border-b border-pastel-pink pb-2 mb-4">내 정보 수정</h3>
                    
                    <div class="flex flex-col items-center mb-6">
                        <div class="relative w-24 h-24 mb-2">
                            <img id="setting-profile-pic" src="" class="w-full h-full rounded-full object-cover border-2 border-main-pink shadow-md">
                            <label class="absolute bottom-0 right-0 bg-deep-pink text-white w-8 h-8 rounded-full flex items-center justify-center border-2 border-white cursor-pointer shadow-sm">
                                <i class="fas fa-camera text-sm"></i>
                                <input type="file" id="input-profile-pic" accept="image/*" class="hidden">
                            </label>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-text-light mb-1 ml-1">닉네임</label>
                            <input type="text" id="setting-nickname" placeholder="예: 사랑둥이">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-text-light mb-1 ml-1">생년월일</label>
                            <input type="date" id="setting-birthdate">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-text-light mb-1 ml-1">비밀번호 변경</label>
                            <input type="password" id="setting-password" placeholder="새 비밀번호 입력">
                        </div>
                        <button id="btn-save-my-info" class="w-full bg-main-pink text-white font-bold py-3 rounded-xl mt-2 shadow-md active:bg-deep-pink">
                            내 정보 저장하기
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-5 cute-shadow">
                    <h3 class="font-bold text-main-pink border-b border-pastel-pink pb-2 mb-4">커플 정보 설정</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-text-light mb-1 ml-1">우리가 만난 날 (D-day 기준)</label>
                            <input type="date" id="setting-dday">
                        </div>
                        <button id="btn-save-couple-info" class="w-full bg-white border-2 border-main-pink text-main-pink font-bold py-3 rounded-xl shadow-sm active:bg-pastel-pink">
                            커플 정보 저장하기
                        </button>
                    </div>
                </div>
            </section>

            <!-- 텍스트 게시판 뷰 -->
            <section id="view-text-board" class="view-section p-4">
                <div class="flex justify-between items-end mb-4 ml-2">
                    <h2 class="font-jua text-2xl text-deep-pink"><i class="fas fa-book-heart mr-2"></i>우리의 일기장</h2>
                </div>
                
                <div class="bg-white rounded-2xl p-4 cute-shadow mb-6 border border-pastel-pink">
                    <input type="text" id="post-input-title" placeholder="제목을 적어주세요" class="mb-2 text-sm font-bold bg-gray-50 border-gray-100 focus:bg-white">
                    <textarea id="post-input-text" rows="3" placeholder="오늘 무슨 일이 있었나요?" class="mb-2 text-sm resize-none"></textarea>
                    <div class="flex justify-end">
                        <button id="btn-submit-post" class="bg-main-pink hover:bg-deep-pink text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-colors">글 남기기</button>
                    </div>
                </div>

                <div id="post-list" class="space-y-4">
                    <!-- JS에서 렌더링됨 -->
                </div>
            </section>

            <!-- 사진 게시판 뷰 -->
            <section id="view-photo-board" class="view-section p-2 relative min-h-full">
                <div class="px-2 pt-2 flex justify-between items-center mb-2">
                    <h2 class="font-jua text-2xl text-deep-pink ml-2"><i class="fas fa-camera-retro mr-2"></i>추억 앨범</h2>
                </div>
                
                <div id="photo-grid" class="photo-grid pb-20">
                    <!-- JS에서 렌더링됨 -->
                </div>

                <!-- 업로드 플로팅 버튼 -->
                <label class="fixed bottom-8 right-6 bg-deep-pink text-white w-14 h-14 rounded-full flex items-center justify-center cute-shadow cursor-pointer hover:bg-main-pink transition-colors z-20 shadow-lg">
                    <i class="fas fa-plus text-2xl"></i>
                    <input type="file" id="input-upload-photo" accept="image/*" class="hidden">
                </label>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        // 사용자 제공 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAZ6SfOKBCftecei_iFGD3-Moen-6AEgBs",
            authDomain: "psye1-65fb3.firebaseapp.com",
            databaseURL: "https://psye1-65fb3-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "psye1-65fb3",
            storageBucket: "psye1-65fb3.firebasestorage.app",
            messagingSenderId: "198807152212",
            appId: "1:198807152212:web:130877756355cd117aefc1"
        };

        const currentAppId = 'couple-app-psye1';

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase Init Error:", e);
            document.getElementById('loader-text').innerText = "파이어베이스 초기화 실패";
        }

        // 상태 변수 관리
        let currentRole = null; 
        let currentUserData = null;
        let coupleData = {};
        let allUsersData = { male: null, female: null };
        let unsubscribes = [];
        let currentPhotosList = []; 
        let currentPhotoModalId = null; 
        let editTargetPostId = null;

        const basePath = `data/couple`;
        const usersRef = ref(db, `${basePath}/accounts`);
        const settingsRef = ref(db, `${basePath}/settings/main`);
        const postsRef = ref(db, `${basePath}/posts`);
        const photosRef = ref(db, `${basePath}/photos`);

        const UI = {
            loader: document.getElementById('app-loader'),
            loginView: document.getElementById('login-view'),
            mainApp: document.getElementById('main-app'),
            sidebar: document.getElementById('sidebar'),

            views: document.querySelectorAll('.view-section'),
            navBtns: document.querySelectorAll('.nav-btn'),
            headerTitle: document.getElementById('header-title'),
            tabs: { male: document.getElementById('tab-male'), female: document.getElementById('tab-female') }
        };

        let selectedLoginRole = 'male'; 

        // 유틸리티 함수
        const Utils = {
            showModal: (title, message, isConfirm = false, onConfirm = null) => {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                const modal = document.getElementById('custom-modal');
                const btnCancel = document.getElementById('modal-btn-cancel');
                const btnConfirm = document.getElementById('modal-btn-confirm');
                
                modal.classList.remove('hidden');
                
                if (isConfirm) {
                    btnCancel.classList.remove('hidden');
                    btnConfirm.classList.replace('w-full', 'w-1/2');
                } else {
                    btnCancel.classList.add('hidden');
                    btnConfirm.classList.replace('w-1/2', 'w-full');
                }

                const close = () => modal.classList.add('hidden');
                
                btnConfirm.onclick = () => { close(); if(onConfirm) onConfirm(); };
                btnCancel.onclick = () => close();
            },
            
            showView: (targetId, title) => {
                UI.views.forEach(v => v.classList.remove('active'));
                document.getElementById('view-' + targetId).classList.add('active');
                UI.headerTitle.innerText = title;
                UI.sidebar.classList.remove('open');
                UI.sidebarOverlay.classList.remove('open');
            },

            formatDate: (timestamp) => {
                if(!timestamp) return '';
                const d = new Date(timestamp);
                return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            },

            resizeImage: (file, maxWidth, quality, callback) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        callback(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            calculateDday: (startDateStr) => {
                if(!startDateStr) return "설정 필요";
                const start = new Date(startDateStr);
                start.setHours(0,0,0,0);
                const now = new Date();
                now.setHours(0,0,0,0);
                const diff = now - start;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24)) + 1;
                return `D+${days}`;
            }
        };

        // 로그인 플로우 시작 (토큰 충돌 방지를 위해 곧바로 signInAnonymously 호출)

                            set(settingsRef, { dday: '', bgImage: '' });
                            Utils.showModal("환영합니다", "초기 데이터가 생성되었습니다.\n기본 비밀번호는 '1234' 입니다.");

                console.error(e);

                    renderTextBoard(posts);
                })

        function renderTextBoard(posts) {
            const listEl = document.getElementById('post-list');
            listEl.innerHTML = '';
            
            if(posts.length === 0) {
                listEl.innerHTML = '<p class="text-center text-text-light py-10 text-sm">첫 번째 이야기를 남겨보세요 ♡</p>';
                return;
            }

            posts.forEach(post => {
                const isMine = post.authorRole === currentRole;
                const authorData = allUsersData[post.authorRole];
                const authorName = authorData ? authorData.nickname : '알 수 없음';
                const profileImg = authorData && authorData.profilePic ? authorData.profilePic : 'https://placehold.co/50x50/ffb3c6/ffffff?text=♡';

                let commentsHtml = '';
                if(post.comments && post.comments.length > 0) {
                    post.comments.forEach((c, idx) => {
                        const cIsMine = c.authorRole === currentRole;
                        const cAuthorData = allUsersData[c.authorRole];
                        const cName = cAuthorData ? cAuthorData.nickname : '알 수 없음';
                        commentsHtml += `
                            <div class="flex items-start gap-2 mt-2 bg-pastel-pink/30 p-2 rounded-lg">
                                <span class="text-xs font-bold text-main-pink min-w-fit">${cName}</span>
                                <span class="text-xs text-text-dark flex-1 break-all">${c.text}</span>
                                ${cIsMine ? `<button class="text-xs text-gray-400 hover:text-red-400" onclick="deleteComment('${post.id}', ${idx})"><i class="fas fa-times"></i></button>` : ''}
                            </div>
                        `;
                    });
                }

                const safeTitle = post.title ? post.title.replace(/"/g, '&quot;') : '';
                const safeText = post.text ? post.text.replace(/"/g, '&quot;') : '';

                const html = `
                    <div class="bg-white rounded-2xl p-4 cute-shadow">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <img src="${profileImg}" class="w-8 h-8 rounded-full object-cover border border-pastel-pink">
                                <div>
                                    <div class="text-sm font-bold text-text-dark">${authorName}</div>
                                    <div class="text-[10px] text-text-light">${Utils.formatDate(post.timestamp)}</div>
                                </div>
                            </div>
                            ${isMine ? `
                            <div class="flex gap-2">
                                <button class="text-xs text-gray-400 hover:text-main-pink font-bold" onclick="openEditModal('${post.id}', '${safeTitle}', '${safeText}')">수정</button>
                                <button class="text-xs text-gray-400 hover:text-red-400 font-bold" onclick="deletePost('${post.id}')">삭제</button>
                            </div>
                            ` : ''}
                        </div>
                        ${post.title ? `<h4 class="font-bold text-deep-pink mb-1 text-base ml-1 break-all">${post.title}</h4>` : ''}
                        <p class="text-sm text-text-dark whitespace-pre-wrap mb-4 ml-1 break-all leading-relaxed">${post.text}</p>
                        
                        <div class="border-t border-pastel-pink pt-3 mt-2">
                            ${commentsHtml}
                            <div class="flex gap-2 mt-3">
                                <input type="text" id="comment-input-${post.id}" placeholder="댓글 달기..." class="text-xs py-2 px-3 border-gray-100 bg-gray-50 rounded-lg">
                                <button class="bg-main-pink text-white text-xs px-4 rounded-lg whitespace-nowrap font-bold shadow-sm" onclick="addComment('${post.id}')">등록</button>
                            </div>
                        </div>
                    </div>
                `;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        }

            if(!text) return;
            try {
                const postRef = ref(db, `${basePath}/posts/${postId}`);
                const snap = await get(postRef);
                if(snap.exists()) {
                    let comments = snap.val().comments || [];
                    comments.push({ text: text, authorRole: currentRole, timestamp: Date.now() });
                    await update(postRef, { comments: comments });
                    input.value = '';
                }
            } catch(e) { Utils.showModal("오류", "댓글 작성 실패"); }
        };

            Utils.showModal("삭제", "댓글을 지울까요?", true, async () => {
                const postRef = ref(db, `${basePath}/posts/${postId}`);
                const snap = await get(postRef);
                if(snap.exists()) {
                    let comments = snap.val().comments || [];
                    comments.splice(commentIdx, 1);
                    await update(postRef, { comments: comments });
                }
            });

                    });

            });

            document.getElementById('photo-modal').classList.remove('hidden');
            document.getElementById('photo-comment-input').value = '';
            renderPhotoComments(photo);
        };

        window.renderPhotoComments = (photo) => {
            const commentsContainer = document.getElementById('photo-modal-comments');
            commentsContainer.innerHTML = '';
            
            if(!photo.comments || photo.comments.length === 0) {
                commentsContainer.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">아직 댓글이 없습니다.</p>';
                return;
            }

            photo.comments.forEach((c, idx) => {
                const cIsMine = c.authorRole === currentRole;
                const cAuthorData = allUsersData[c.authorRole];
                const cName = cAuthorData ? cAuthorData.nickname : '알 수 없음';
                const html = `
                    <div class="flex items-start gap-2 bg-pastel-pink/20 p-2 rounded-lg mb-2">
                        <span class="text-xs font-bold text-main-pink min-w-fit">${cName}</span>
                        <span class="text-xs text-text-dark flex-1 break-all">${c.text}</span>
                        ${cIsMine ? `<button class="text-xs text-gray-400 hover:text-red-400" onclick="deletePhotoComment('${photo.id}', ${idx})"><i class="fas fa-times"></i></button>` : ''}
                    </div>
                `;
                commentsContainer.insertAdjacentHTML('beforeend', html);
            });
            setTimeout(() => { commentsContainer.scrollTop = commentsContainer.scrollHeight; }, 50);
        };

        document.getElementById('btn-add-photo-comment').onclick = async () => {
            if(!currentPhotoModalId) return;
            const input = document.getElementById('photo-comment-input');
            const text = input.value.trim();
            if(!text) return;

            try {
                const photoRef = ref(db, `${basePath}/photos/${currentPhotoModalId}`);
                const snap = await get(photoRef);
                if(snap.exists()) {
                    let comments = snap.val().comments || [];
                    comments.push({ text: text, authorRole: currentRole, timestamp: Date.now() });
                    await update(photoRef, { comments: comments });
                    input.value = '';
                }
            } catch(e) { Utils.showModal("오류", "댓글 작성 실패"); }
        };

        window.deletePhotoComment = async (photoId, commentIdx) => {
            Utils.showModal("삭제", "댓글을 삭제할까요?", true, async () => {
                const photoRef = ref(db, `${basePath}/photos/${photoId}`);
                const snap = await get(photoRef);
                if(snap.exists()) {
                    let comments = snap.val().comments || [];
                    comments.splice(commentIdx, 1);
                    await update(photoRef, { comments: comments });
                }
            });
        };
    </script>
</body>
</html>
