<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 스마트폰에 최적화된 뷰포트 설정 (확대 방지) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리의 공간 ♡</title>
    
    <!-- 폰트 및 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pastel-pink': '#ffe4e8',
                        'main-pink': '#ffb3c6',
                        'deep-pink': '#ff8fab',
                        'text-dark': '#5c4d50',
                        'text-light': '#8a7d80'
                    },
                    fontFamily: {
                        'dodum': ['"Gowun Dodum"', 'sans-serif'],
                        'jua': ['"Jua"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #ffe4e8; /* pastel-pink */
            color: #5c4d50;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 스크롤바 숨기기 (모바일 앱 느낌) */
        ::-webkit-scrollbar { display: none; }
        
        .cute-shadow {
            box-shadow: 0 4px 15px rgba(255, 143, 171, 0.2);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* 좌측 슬라이딩 메뉴 애니메이션 */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
            z-index: 50;
        }
        #sidebar.open {
            transform: translateX(0);
        }
        #sidebar-overlay {
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }
        #sidebar-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* 사진 게시판 균일한 썸네일 그리드 */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }
        .photo-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1 / 1;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 커스텀 로더 */
        .heart-loader {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
            transform: rotate(45deg);
            transform-origin: 40px 40px;
        }
        .heart-loader div {
            top: 32px;
            left: 32px;
            position: absolute;
            width: 32px;
            height: 32px;
            background: #ff8fab;
            animation: heart-loader 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }
        .heart-loader div:after, .heart-loader div:before {
            content: " ";
            position: absolute;
            display: block;
            width: 32px;
            height: 32px;
            background: #ff8fab;
        }
        .heart-loader div:before { left: -24px; border-radius: 50% 0 0 50%; }
        .heart-loader div:after { top: -24px; border-radius: 50% 50% 0 0; }
        @keyframes heart-loader {
            0% { transform: scale(0.95); }
            5% { transform: scale(1.1); }
            39% { transform: scale(0.85); }
            45% { transform: scale(1); }
            60% { transform: scale(0.95); }
            100% { transform: scale(0.9); }
        }

        .view-section { display: none; padding-bottom: 80px; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        input, textarea, select {
            outline: none;
            border: 2px solid #ffe4e8;
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #ffb3c6; }
        button { user-select: none; }
    </style>
</head>

    <!-- 전역 로더 -->

                    <i class="fas fa-plus text-2xl"></i>
                    <input type="file" id="input-upload-photo" accept="image/*" class="hidden">
                </label>
            </section>

        </main>
    </div>

    <!-- Firebase SDK -->

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // 더미 컨피그 (실제 환경에서는 __firebase_config가 주입됨)
            apiKey: "dummy-key", authDomain: "dummy.firebaseapp.com", projectId: "dummy-project"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        // 상태 관리
        let currentRole = null; // 'male' or 'female'
        let currentUserData = null;
        let coupleData = {};
        let allUsersData = { male: null, female: null };
        let unsubscribes = [];
        let currentPhotosList = []; // 추가: 현재 사진 리스트 저장용
        let currentPhotoModalId = null; // 추가: 열려있는 사진 모달 ID

        // DOM 요소
        const UI = {
            loader: document.getElementById('app-loader'),
            loginView: document.getElementById('login-view'),
            mainApp: document.getElementById('main-app'),

            showModal: (title, message, isConfirm = false, onConfirm = null) => {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                const modal = document.getElementById('custom-modal');
                const btnCancel = document.getElementById('modal-btn-cancel');
                const btnConfirm = document.getElementById('modal-btn-confirm');
                
                modal.classList.remove('hidden');
                
                if (isConfirm) {
                    btnCancel.classList.remove('hidden');
                } else {
                    btnCancel.classList.add('hidden');
                }

                const close = () => modal.classList.add('hidden');
                
                btnConfirm.onclick = () => { close(); if(onConfirm) onConfirm(); };
                btnCancel.onclick = () => close();
            },
            
            showView: (targetId, title) => {
                UI.views.forEach(v => v.classList.remove('active'));
                document.getElementById('view-' + targetId).classList.add('active');
                UI.headerTitle.innerText = title;
                UI.sidebar.classList.remove('open');
                UI.sidebarOverlay.classList.remove('open');
            },

            formatDate: (timestamp) => {
                if(!timestamp) return '';
                const d = new Date(timestamp);
                return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            },

            // Canvas API를 이용한 클라이언트 사이드 이미지 리사이징 (비율 유지)
            resizeImage: (file, maxWidth, quality, callback) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        callback(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            calculateDday: (startDateStr) => {
                if(!startDateStr) return "설정 필요";
                const start = new Date(startDateStr);
                start.setHours(0,0,0,0);
                const now = new Date();
                now.setHours(0,0,0,0);
                const diff = now - start;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24)) + 1; // 시작일을 1일로 계산
                return `D+${days}`;
            }
        };

        // Auth Listener
        onAuthStateChanged(auth, async (user) => {

                            female: { id: 'female', pass: '1234', nickname: '여자친구', birthdate: '', profilePic: '' }

                            Utils.showModal("환영합니다", "초기 설정이 완료되었습니다.\n기본 비밀번호는 '1234' 입니다.");
                        });
                    }
                }, (error) => {
                    console.error("DB Error:", error);
                    Utils.showModal("오류", "데이터를 불러올 수 없습니다.");
                });

            }

        // 텍스트 게시판 렌더링
        function renderTextBoard(posts) {
            const listEl = document.getElementById('post-list');
            listEl.innerHTML = '';
            
            if(posts.length === 0) {
                listEl.innerHTML = '<p class="text-center text-text-light py-10 text-sm">첫 번째 이야기를 남겨보세요 ♡</p>';
                return;
            }

            posts.forEach(post => {
                const isMine = post.authorRole === currentRole;
                const authorData = allUsersData[post.authorRole];
                const authorName = authorData ? authorData.nickname : '알 수 없음';
                const profileImg = authorData && authorData.profilePic ? authorData.profilePic : 'https://placehold.co/50x50/ffb3c6/ffffff?text=♡';

                // 댓글 렌더링 HTML 생성
                let commentsHtml = '';
                if(post.comments && post.comments.length > 0) {
                    post.comments.forEach((c, idx) => {
                        const cIsMine = c.authorRole === currentRole;
                        const cAuthorData = allUsersData[c.authorRole];
                        const cName = cAuthorData ? cAuthorData.nickname : '알 수 없음';
                        commentsHtml += `
                            <div class="flex items-start gap-2 mt-2 bg-pastel-pink/30 p-2 rounded-lg">
                                <span class="text-xs font-bold text-main-pink min-w-fit">${cName}</span>
                                <span class="text-xs text-text-dark flex-1 break-all">${c.text}</span>
                                ${cIsMine ? `<button class="text-xs text-gray-400 hover:text-red-400" onclick="deleteComment('${post.id}', ${idx})"><i class="fas fa-times"></i></button>` : ''}
                            </div>
                        `;
                    });
                }

                // JS 이스케이프 처리 (prompt 창에 넘길 때 오류 방지)
                const safeTitle = post.title ? post.title.replace(/'/g, "\\'").replace(/"/g, "&quot;") : '';
                const safeText = post.text ? post.text.replace(/'/g, "\\'").replace(/"/g, "&quot;").replace(/\n/g, "\\n") : '';

                const html = `
                    <div class="bg-white rounded-2xl p-4 cute-shadow">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <img src="${profileImg}" class="w-8 h-8 rounded-full object-cover">
                                <div>
                                    <div class="text-sm font-bold text-text-dark">${authorName}</div>
                                    <div class="text-[10px] text-text-light">${Utils.formatDate(post.timestamp)}</div>
                                </div>
                            </div>
                            ${isMine ? `
                            <div class="flex gap-2">
                                <button class="text-xs text-gray-400 hover:text-main-pink" onclick="editPost('${post.id}', '${safeTitle}', '${safeText}')">수정</button>
                                <button class="text-xs text-gray-400 hover:text-red-400" onclick="deletePost('${post.id}')">삭제</button>
                            </div>
                            ` : ''}
                        </div>
                        ${post.title ? `<h4 class="font-bold text-deep-pink mb-1 text-base ml-1 break-all">${post.title}</h4>` : ''}
                        <p class="text-sm text-text-dark whitespace-pre-wrap mb-4 ml-1 break-all">${post.text}</p>
                        
                        <!-- 댓글 영역 -->
                        <div class="border-t border-gray-100 pt-2 mt-2">
                            ${commentsHtml}
                            <div class="flex gap-2 mt-2">
                                <input type="text" id="comment-input-${post.id}" placeholder="댓글 달기..." class="text-xs py-1 px-3 border-gray-200">
                                <button class="bg-main-pink text-white text-xs px-3 rounded-lg whitespace-nowrap" onclick="addComment('${post.id}')">등록</button>
                            </div>
                        </div>
                    </div>
                `;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        }

        document.getElementById('input-home-bg').onchange = (e) => {

            });

        document.getElementById('btn-submit-post').onclick = async () => {
            const titleInput = document.getElementById('post-input-title');
            const input = document.getElementById('post-input-text');
            const title = titleInput.value.trim();
            const text = input.value.trim();
            
            if(!title) { Utils.showModal("알림", "제목을 적어주세요."); return; }
            if(!text) { Utils.showModal("알림", "내용을 적어주세요."); return; }
            
            try {
                const newDocRef = doc(postsColRef);
                await setDoc(newDocRef, {
                    title: title,
                    text: text,
                    authorRole: currentRole,
                    timestamp: Date.now(),
                    comments: []
                });
                titleInput.value = '';
                input.value = '';
            } catch(e) {
                Utils.showModal("오류", "글 작성에 실패했습니다.");
            }
        };

        // [게시판] 글 삭제 (전역 노출)
        window.deletePost = (postId) => {
            Utils.showModal("삭제", "이 이야기를 지울까요?", true, async () => {
                await deleteDoc(doc(postsColRef, postId));
            });

        // [게시판] 글 수정
        window.editPost = (postId, currentTitle, currentText) => {
            const newTitle = prompt("제목을 수정하세요:", currentTitle);
            if(newTitle === null) return;
            const newText = prompt("이야기를 수정하세요:", currentText);
            if(newText === null) return;

            if(newTitle.trim() !== "" && newText.trim() !== "") {
                updateDoc(doc(postsColRef, postId), { 
                    title: newTitle.trim(),
                    text: newText.trim() 
                });
            }
        };

        // [게시판] 댓글 작성
        window.addComment = async (postId) => {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if(!text) return;

            try {
                const postRef = doc(postsColRef, postId);
                const docSnap = await getDoc(postRef);
                if(docSnap.exists()) {
                    let comments = docSnap.data().comments || [];
                    comments.push({ text: text, authorRole: currentRole, timestamp: Date.now() });
                    await updateDoc(postRef, { comments: comments });
                }
            } catch(e) {
                Utils.showModal("오류", "댓글 작성 실패");
            }
        };

        window.deleteComment = async (postId, commentIdx) => {
            Utils.showModal("삭제", "댓글을 삭제할까요?", true, async () => {
                const postRef = doc(postsColRef, postId);
                const docSnap = await getDoc(postRef);
                if(docSnap.exists()) {
                    let comments = docSnap.data().comments || [];
                    comments.splice(commentIdx, 1);
                    await updateDoc(postRef, { comments: comments });
                }
            });

            if(!file) return;
            
            Utils.showModal("업로드 중", "사진을 최적화하여 올리고 있습니다...");
            // 사진 게시판용 최대 너비 1080px 유지, 비율 자동 조절
            Utils.resizeImage(file, 1080, 0.7, async (base64) => {
                try {
                    const newDocRef = doc(photosColRef);
                    await setDoc(newDocRef, {
                        image: base64,
                        authorRole: currentRole,
                        timestamp: Date.now(),
                        comments: []
                    });
                    document.getElementById('custom-modal').classList.add('hidden');
                } catch(err) {
                    Utils.showModal("오류", "사진 업로드에 실패했습니다.");
                }
            });
        };

        // 사진 게시판 렌더링
        function renderPhotoBoard(photos) {
            const gridEl = document.getElementById('photo-grid');
            gridEl.innerHTML = '';
            
            if(photos.length === 0) {
                gridEl.innerHTML = '<p class="text-center text-text-light py-10 text-sm w-full col-span-2">첫 번째 사진을 올려보세요 ♡</p>';
                return;
            }

            photos.forEach(photo => {
                const isMine = photo.authorRole === currentRole;
                const cCount = photo.comments ? photo.comments.length : 0;

                const html = `
                    <div class="photo-item cute-shadow group cursor-pointer" onclick="openPhotoModal('${photo.id}')">
                        <img src="${photo.image}" loading="lazy">
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-2 flex justify-between items-end pointer-events-none">
                            <span class="text-white text-[10px] drop-shadow-md"><i class="fas fa-comment mr-1"></i> ${cCount}</span>
                        </div>
                        ${isMine ? `<button class="absolute top-2 right-2 text-white text-[10px] bg-red-500/80 px-2 py-1 rounded shadow pointer-events-auto" onclick="event.stopPropagation(); deletePhoto('${photo.id}')">삭제</button>` : ''}
                    </div>
                `;
                gridEl.insertAdjacentHTML('beforeend', html);
            });
        }

        // [사진] 삭제
        window.deletePhoto = (photoId) => {
            Utils.showModal("삭제", "이 사진을 지울까요?", true, async () => {
                await deleteDoc(doc(photosColRef, photoId));
            });
        };

        // [사진] 상세 모달 열기 및 닫기
        document.getElementById('btn-close-photo-modal').onclick = () => {
            document.getElementById('photo-modal').classList.add('hidden');
            currentPhotoModalId = null;
        };

        window.openPhotoModal = (photoId) => {
            const photo = currentPhotosList.find(p => p.id === photoId);
            if(!photo) return;
            
            currentPhotoModalId = photoId;
            document.getElementById('photo-modal-img').src = photo.image;
            document.getElementById('photo-modal').classList.remove('hidden');
            document.getElementById('photo-comment-input').value = '';
            
            renderPhotoComments(photo);
        };

        // [사진] 댓글 렌더링
        window.renderPhotoComments = (photo) => {
            const commentsContainer = document.getElementById('photo-modal-comments');
            commentsContainer.innerHTML = '';
            
            if(!photo.comments || photo.comments.length === 0) {
                commentsContainer.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">아직 댓글이 없습니다.</p>';
                return;
            }

            photo.comments.forEach((c, idx) => {
                const cIsMine = c.authorRole === currentRole;
                const cAuthorData = allUsersData[c.authorRole];
                const cName = cAuthorData ? cAuthorData.nickname : '알 수 없음';
                
                const html = `
                    <div class="flex items-start gap-2 bg-pastel-pink/20 p-2 rounded-lg mb-2">
                        <span class="text-xs font-bold text-main-pink min-w-fit">${cName}</span>
                        <span class="text-xs text-text-dark flex-1 break-all">${c.text}</span>
                        ${cIsMine ? `<button class="text-xs text-gray-400 hover:text-red-400" onclick="deletePhotoComment('${photo.id}', ${idx})"><i class="fas fa-times"></i></button>` : ''}
                    </div>
                `;
                commentsContainer.insertAdjacentHTML('beforeend', html);
            });
            // 렌더링 후 스크롤을 맨 아래로 이동
            setTimeout(() => {
                commentsContainer.scrollTop = commentsContainer.scrollHeight;
            }, 50);
        };

        // [사진] 댓글 달기
        document.getElementById('btn-add-photo-comment').onclick = async () => {
            if(!currentPhotoModalId) return;
            const input = document.getElementById('photo-comment-input');
            const text = input.value.trim();
            if(!text) return;

            try {
                const postRef = doc(photosColRef, currentPhotoModalId);
                const docSnap = await getDoc(postRef);
                if(docSnap.exists()) {
                    let comments = docSnap.data().comments || [];
                    comments.push({ text: text, authorRole: currentRole, timestamp: Date.now() });
                    await updateDoc(postRef, { comments: comments });
                    input.value = '';
                }
            } catch(e) {
                Utils.showModal("오류", "댓글 작성 실패");
            }
        };

        // [사진] 댓글 삭제
        window.deletePhotoComment = async (photoId, commentIdx) => {
            Utils.showModal("삭제", "댓글을 삭제할까요?", true, async () => {
                const postRef = doc(photosColRef, photoId);
                const docSnap = await getDoc(postRef);
                if(docSnap.exists()) {
                    let comments = docSnap.data().comments || [];
                    comments.splice(commentIdx, 1);
                    await updateDoc(postRef, { comments: comments });
                }
            });
        };

    </script>
</body>
</html>
